[package]
name = "localdock"
version = "0.1.8"
description = "LocalDock Windows 本地开发工作台"
authors = ["LocalDock"]
edition = "2021"

[lib]
name = "localdock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.0.0", features = [] }
